<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients & Services</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="pr_cities.js"></script>
    <script src="init_sql.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; padding: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        select, button { padding: 8px; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px 12px; border-bottom: 1px solid #ddd; }
        th { background: #f7f9fa; }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            text-decoration: none;
            font-size: 1.2em;
            padding: 6px 14px;
            border-radius: 6px;
            background: #28a745;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: inline-block;
        }
        .warning { color: #a94400; font-size: 0.95em; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">⬅️ Back</a>
    <div class="card" style="margin-top: 60px;">
        <h2>Clients</h2>
        <button id="addClientBtn" style="margin-bottom:12px;">➕ Create New Client</button>
        <select id="clientSelect">
            <option value="">-- Select a client --</option>
        </select>
        <div id="clientInfo"></div>
        <p id="dbStatus" class="warning"></p>
    </div>
    <div class="card" id="serviceCard" style="display:none;">
        <h2>Service Information</h2>
        <table id="serviceTable">
            <thead>
                <tr><th>Date</th><th>Notes</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const $clientSelect = $('#clientSelect');
        $clientSelect.select2({ width: '100%', placeholder: '-- Select a client --' });

        function populateClientSelect(selectedId = "") {
            const select = document.getElementById('clientSelect');
            select.innerHTML = '<option value="">-- Select a client --</option>';
            getClients().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c[0];
                opt.textContent = c[2] ? `${c[1]} (${c[2]})` : c[1];
                select.appendChild(opt);
            });
            // Select2 listens to jQuery events, so notify it through jQuery
            $clientSelect.val(String(selectedId)).trigger('change');
        }

        function showClient(id) {
            const infoDiv = document.getElementById('clientInfo');
            const serviceCard = document.getElementById('serviceCard');
            const client = id ? getClient(id) : null;
            if (!client) {
                infoDiv.innerHTML = '';
                serviceCard.style.display = 'none';
                return;
            }
            infoDiv.innerHTML =
                `<strong>Name:</strong> ${escapeHtml(client[1])}<br>` +
                `<strong>Address:</strong> ${escapeHtml(client[2])}<br>` +
                `<strong>Phone:</strong> ${escapeHtml(client[3])}`;

            const services = getServices(id);
            const tbody = document.querySelector('#serviceTable tbody');
            tbody.innerHTML = services.length
                ? services.map(s => `<tr><td>${escapeHtml(s[2])}</td><td>${escapeHtml(s[3])}</td></tr>`).join('')
                : '<tr><td colspan="2">No services found.</td></tr>';
            serviceCard.style.display = '';
        }

        // Select2 triggers jQuery 'change' events, which native addEventListener does not receive
        $clientSelect.on('change', function () {
            showClient(this.value);
        });

        initDatabase().then(() => {
            populateClientSelect();
        }).catch(err => {
            console.error(err);
            document.getElementById('dbStatus').textContent = 'Could not load the client database.';
        });

        document.getElementById('addClientBtn').addEventListener('click', function() {
            openAddClientPopup();
        });

        function readClientForm() {
            return [
                document.getElementById('swal-name').value.trim(),
                document.getElementById('swal-address').value.trim(),
                document.getElementById('swal-phone').value.trim(),
                document.getElementById('swal-lat').value,
                document.getElementById('swal-lon').value
            ];
        }

        function openAddClientPopup(formVals = ["", "", "", "", ""], cityIndex = 0)
        {
            const cityOptions = prCities.map((c, i) =>
                `<option value="${c.lat},${c.lon}" ${i === cityIndex ? "selected" : ""}>${escapeHtml(c.name)}</option>`
            ).join('');
            Swal.fire({
                title: 'Add New Client',
                html:
                    `<input id="swal-name" class="swal2-input" placeholder="Name" value="${escapeHtml(formVals[0])}">` +
                    `<input id="swal-address" class="swal2-input" placeholder="Address" value="${escapeHtml(formVals[1])}">` +
                    `<input id="swal-phone" class="swal2-input" placeholder="Phone" value="${escapeHtml(formVals[2])}">` +
                    `<label style="display:block;margin:8px 0 2px 0;font-size:0.95em;">Select client's city (for map):</label>
                    <select id="swal-city" class="swal2-input" style="width:90%">${cityOptions}</select>
                    <button id="swal-map-btn" type="button" class="swal2-confirm swal2-styled" style="margin-top:8px;">Select Client Coords on Map</button>
                    <input id="swal-lat" class="swal2-input" placeholder="Latitude" readonly style="margin-top:8px;" value="${escapeHtml(formVals[3])}">
                    <input id="swal-lon" class="swal2-input" placeholder="Longitude" readonly value="${escapeHtml(formVals[4])}">`,
                showCancelButton: true,
                confirmButtonText: 'Save',
                cancelButtonText: 'Cancel',
                didOpen: () => {
                    $('#swal-city').select2({ dropdownParent: $('.swal2-container'), width: '100%', placeholder: "Select city..." });
                    document.getElementById('swal-map-btn').onclick = function () {
                        // Save current form values before opening map
                        const currentVals = readClientForm();
                        const citySel = document.getElementById('swal-city');
                        const [lat, lon] = citySel.value.split(',').map(Number);
                        const cityIdx = citySel.selectedIndex;
                        let picked = null;
                        Swal.fire({
                            title: "Now select client's coords",
                            html: '<div id="mapid" style="height:300px;width:100%;margin-bottom:8px;"></div><div style="font-size:0.95em;">Click on the map to select the client\'s location.</div>',
                            showCancelButton: true,
                            cancelButtonText: "Cancel",
                            showConfirmButton: false,
                            didOpen: () => {
                                const map = L.map('mapid').setView([lat, lon], 13);
                                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                    maxZoom: 19,
                                    attribution: '© OpenStreetMap'
                                }).addTo(map);
                                setTimeout(() => map.invalidateSize(), 200);
                                map.on('click', function (e) {
                                    picked = e.latlng;
                                    Swal.close();
                                });
                            }
                        }).then(() => {
                            // Reopen the main popup, keeping the fields (and the new coords if one was picked)
                            const updatedVals = [...currentVals];
                            if (picked) {
                                updatedVals[3] = picked.lat.toFixed(6);
                                updatedVals[4] = picked.lng.toFixed(6);
                            }
                            openAddClientPopup(updatedVals, cityIdx);
                        });
                    };
                },
                focusConfirm: false,
                preConfirm: () => {
                    const vals = readClientForm();
                    if (!vals[0]) {
                        Swal.showValidationMessage('Name is required');
                        return false;
                    }
                    return vals;
                }
            }).then(result => {
                if (result.isConfirmed && result.value) {
                    const [name, address, phone, lat, lon] = result.value;
                    const newId = addClient(name, address, phone, lat ? Number(lat) : null, lon ? Number(lon) : null);
                    populateClientSelect(newId);
                    Swal.fire('Success', 'Client added!', 'success');
                }
            });
        }
    </script>
</body>
</html>
